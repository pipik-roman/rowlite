name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Run Tests
        run: go test -v ./...
      - name: Vulnerability Check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
