# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: rowlite

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: rowlite
    main: ./cmd/rowlite
    binary: rowlite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/pipik-roman/rowlite/internal/cmd.Version={{.Version}}
      - -X github.com/pipik-roman/rowlite/internal/cmd.Commit={{.Commit}}
      - -X github.com/pipik-roman/rowlite/internal/cmd.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: default
    artifacts: archive
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
    documents:
      - "${artifact}.spdx.json"

signs:
  - id: cosign-keyless
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

release:
  github:
    owner: pipik-roman
    name: rowlite
  draft: false
  prerelease: auto

homebrew_casks:
  - name: rowlite
    repository:
      owner: pipik-roman
      name: homebrew-tap
      branch: main
    homepage: "https://github.com/pipik-roman/rowlite"
    description: "Markdown table manipulator CLI and stdio MCP server"
    license: "MIT"
    skip_upload: auto

scoops:
  - name: rowlite
    repository:
      owner: pipik-roman
      name: scoop-bucket
      branch: main
    homepage: "https://github.com/pipik-roman/rowlite"
    description: "Markdown table manipulator CLI and stdio MCP server"
    license: "MIT"
    skip_upload: auto
